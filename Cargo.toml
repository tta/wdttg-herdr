[package]
name = "wdttg-herdr"
version = "0.1.0"
edition = "2021"
description = "Herdr plugin that auto-tracks time per workspace into wdttg"
license = "MIT"

[dependencies]
wdttg = { path = "../wdttg" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
